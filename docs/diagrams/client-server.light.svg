<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1193px" height="593px" viewBox="0 0 1193 593"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="cc"><g transform="translate(0.5,0.5)"><rect x="10" y="10" width="440" height="560" rx="17.6" ry="17.6" fill="#eef5fd" stroke="#6c8ebf" stroke-width="1.2" pointer-events="all" style="fill: rgb(238, 245, 253); stroke: rgb(108, 142, 191);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="22" y="32">Android app (game-out-client)</text></g></g></g><g data-cell-id="gps"><g transform="translate(0.5,0.5)"><rect x="30" y="50" width="400" height="56" rx="5.6" ry="5.6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="230" y="76">GameActivity: Fused Location Provider</text><text x="230" y="90">GPS fix every 800 ms, field calibrated on 2 corners</text></g></g></g><g data-cell-id="conv"><g transform="translate(0.5,0.5)"><rect x="30" y="140" width="400" height="70" rx="7" ry="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="230" y="166">LatiLongHV, PlayFieldPos</text><text x="230" y="180">GPS fix -&gt; paddle position on a 12000 x 12000 field,</text><text x="230" y="194">extrapolated between fixes</text></g></g></g><g data-cell-id="thr"><g transform="translate(0.5,0.5)"><rect x="30" y="244" width="400" height="56" rx="5.6" ry="5.6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="230" y="270">PlayFieldThread: every 125 ms</text><text x="230" y="284">syncGameState(), then draw ball and paddles</text></g></g></g><g data-cell-id="net"><g transform="translate(0.5,0.5)"><rect x="30" y="334" width="400" height="84" rx="8.4" ry="8.4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(108, 142, 191);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="230" y="367">RemoteGameState, GameoutClient</text><text x="230" y="381">start the session (TCP), then send the paddle</text><text x="230" y="395">position and read the game state (UDP)</text></g></g></g><g data-cell-id="room"><g transform="translate(0.5,0.5)"><rect x="30" y="480" width="400" height="56" rx="5.6" ry="5.6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2" pointer-events="all" style="fill: rgb(225, 213, 231); stroke: rgb(150, 115, 166);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="230" y="506">OnlineGameActivity: Google Play Games</text><text x="230" y="520">real-time room, invitations</text></g></g></g><g data-cell-id="sc"><g transform="translate(0.5,0.5)"><rect x="710" y="10" width="460" height="560" rx="18.4" ry="18.4" fill="#fffbea" stroke="#d6b656" stroke-width="1.2" pointer-events="all" style="fill: rgb(255, 251, 234); stroke: rgb(214, 182, 86);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="722" y="32">Java server (gameout-server)</text></g></g></g><g data-cell-id="tick"><g transform="translate(0.5,0.5)"><rect x="730" y="50" width="360" height="56" rx="5.6" ry="5.6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(214, 182, 86);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="910" y="76">StreamServer thread: game loop</text><text x="910" y="90">every 20 ms: update() on each RUNNING game</text></g></g></g><g data-cell-id="logic"><g transform="translate(0.5,0.5)"><rect x="730" y="140" width="360" height="70" rx="7" ry="7" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(214, 182, 86);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="910" y="166">MonoPong / MultiPong</text><text x="910" y="180">ball motion, bounces on walls and paddles,</text><text x="910" y="194">scores, end of game</text></g></g></g><g data-cell-id="state"><g transform="translate(0.5,0.5)"><rect x="730" y="244" width="360" height="56" rx="5.6" ry="5.6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="910" y="270">gameStateList</text><text x="910" y="284">one GameState per session: ball, 3 teams, players</text></g></g></g><g data-cell-id="sess"><g transform="translate(0.5,0.5)"><rect x="730" y="340" width="360" height="56" rx="5.6" ry="5.6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(214, 182, 86);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="910" y="366">SessionServer  TCP 9475</text><text x="910" y="380">create or join the session of a room</text></g></g></g><g data-cell-id="msg"